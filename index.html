<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2933">
<link rel="manifest" href="manifest.webmanifest">
<title>Menara Ban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="busy"></div>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></div>
<div id="splash"><div class="tire spin"></div></div>
<div id="scrim" onclick="toggleSide(false)"></div>

<!-- LOGIN -->
<section id="login">
  <form class="lbox" id="lform">
    <div class="logo"><div class="tire"></div><div><b>Menara Ban</b></div></div>
<h2 style="text-align:center;margin:22px 0 16px">Masuk</h2>
    <label class="f"><span>Username</span><input id="lu" autocomplete="username" required></label><br>
    <label class="f"><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label><br>
    <button class="btn p" style="width:100%;padding:10px" id="lbtn">Masuk</button>
  </form>
</section>

<!-- APP -->
<div id="app">
  <aside id="side">
    <div class="logo"><div class="tire"></div><div><b id="sName">Menara Ban</b></div></div>
    <nav id="nav"></nav>
    <div class="me"><b id="meName"></b><span id="meRole"></span><button class="btn s" onclick="logout()">Keluar</button></div>
  </aside>
  <main>
    <div class="top"><button class="btn" id="burger" onclick="toggleSide()">Menu</button><h1 id="title"></h1><span id="topAct"></span></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script src="app.js?v=14" defer></script>
</body>
</html>
